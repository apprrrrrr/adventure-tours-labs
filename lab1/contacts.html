<body>
    <header class="main-header">
        <a class="main-header-logo" href="index.html">Агентство приключенческих туров</a>
        <nav class="main-nav">
            <ul class="site-navigation">
                <li class="site-navigation-item"><a href="index.html">Главная</a></li>
                <li class="site-navigation-item"><a href="tours.html">Туры</a></li>

        </nav>

    <main>
        <h1>Контакты</h1>
        <section class="feedback-form">
            <h2>Форма обратной связи</h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Ваше имя:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="message">Сообщение:</label><br>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>
                <p>
                    <button type="submit">Отправить</button>
                </p>
            </form>
        </section>
        <section class="address">
            <h2>Наш адрес</h2>
            <p>г. Минск, ул. Приключенческая, д. 15, офис 42</p>
        </section>
        <section class="hotline">
            <h2>Телефон горячей линии</h2>
            <p>Звоните круглосуточно: <a href="tel:+375291234567">+375 (29) 123-45-67</a></p>
        </section>
    </main>
    <footer class="main-footer">

    </footer>
